<!-- [class.abierto] le agrega la clase "abierto" a la barra cuando el menú está desplegado -->
<nav class="navbar" [class.abierto]="menuAbierto()">
  <div class="logo" routerLink="/peliculas">
    CINE<span>MORE</span>
  </div>

  <!-- Bbotón de hamburguesa, solo visible en pantallas chicas -->
  <button class="btn-menu" (click)="alternarMenu()" aria-label="Abrir menú">
    {{ menuAbierto() ? '✕' : '☰' }}
  </button>

  <!-- Al tocar cualquier opción, el menú se vuelve a cerrar -->
  <ul class="nav-links" (click)="menuAbierto.set(false)">
    <li><a routerLink="/peliculas" routerLinkActive="active">PELÍCULAS</a></li>
    <li><a routerLink="/candy" routerLinkActive="active">CANDY</a></li>
    <li><a routerLink="/club-puntos" routerLinkActive="active">CLUB / PUNTOS</a></li>
    <li><a routerLink="/proximamente" routerLinkActive="active">PRÓXIMAMENTE</a></li>
  </ul>

 <div class="nav-acciones" (click)="menuAbierto.set(false)">
    <button class="btn-login" routerLink="/checkout" [disabled]="carrito.cantidadItems() === 0">
      CARRITO ({{ carrito.cantidadItems() }})
    </button>

    @if (auth.emailUsuario()) {
      <button class="btn-login" routerLink="/perfil">PERFIL</button>
      <button *appPersonal class="btn-login" routerLink="/empleado">VALIDAR</button>
      <button *appAdmin class="btn-login" routerLink="/admin">ADMIN</button>
      <span class="texto-usuario">{{ auth.emailUsuario() }}</span>
      <app-campanita (click)="$event.stopPropagation()" />
      <button class="btn-login" (click)="cerrarSesion()">SALIR</button>
    } @else {
      <button class="btn-login" routerLink="/login">INGRESAR</button>
      <button class="btn-registro" routerLink="/registro">REGISTRARSE</button>
    }
  </div>
